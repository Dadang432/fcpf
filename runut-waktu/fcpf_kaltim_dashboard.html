<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Runut Waktu & Aliran Dana Karbon — FCPF-CF Kalimantan Timur</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { margin:0; font-family:'Inter', ui-sans-serif, system-ui; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

/* ---------------- Minimal line-icon set (stroke-based, 24x24) ---------------- */
const Icon = ({ path, size = 18, color = "currentColor", strokeWidth = 2 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
       strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
    {path}
  </svg>
);
const Leaf = (p) => <Icon {...p} path={<>
  <path d="M11 20A7 7 0 0 1 4 13c0-5 4-10 12-11 0 8-3 13-9 13" />
  <path d="M4 20c4-3 6-6 8-9" />
</>} />;
const Landmark = (p) => <Icon {...p} path={<>
  <line x1="3" y1="21" x2="21" y2="21" /><line x1="5" y1="21" x2="5" y2="10" />
  <line x1="9" y1="21" x2="9" y2="10" /><line x1="15" y1="21" x2="15" y2="10" />
  <line x1="19" y1="21" x2="19" y2="10" /><polygon points="12 3 21 8 3 8" />
</>} />;
const Banknote = (p) => <Icon {...p} path={<>
  <rect x="2" y="6" width="20" height="12" rx="2" /><circle cx="12" cy="12" r="2.5" />
  <path d="M6 9v.01M18 15v.01" />
</>} />;
const Wallet = (p) => <Icon {...p} path={<>
  <path d="M20 7H5a2 2 0 0 1 0-4h13v4" /><path d="M20 7v13a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V6" />
  <path d="M17 13h3v3h-3a1.5 1.5 0 0 1 0-3Z" />
</>} />;
const FileSignature = (p) => <Icon {...p} path={<>
  <path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9" /><path d="M14 3v5h5" />
  <path d="M8 16c1-1.5 2-1.5 3 0s2 1.5 3 0" />
</>} />;
const ShieldCheck = (p) => <Icon {...p} path={<>
  <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z" />
  <path d="M9 12l2 2 4-4" />
</>} />;
const Trees = (p) => <Icon {...p} path={<>
  <path d="M8 13 5 8h6l-3-5" /><path d="M8 8V3" /><path d="M8 13v8" />
  <path d="M17 15l-3.5-6h7L17 15Z" /><path d="M17 9V3" /><path d="M17 15v6" />
</>} />;
const Sprout = (p) => <Icon {...p} path={<>
  <path d="M7 20h10" /><path d="M12 20v-8" />
  <path d="M5 8c0 3 2 5 5 5-1-3 1-6 4-7-1 3 0 6 3 7 2-0.5 2-4 0-6-3-3-8-2-9 1" />
</>} />;
const Users = (p) => <Icon {...p} path={<>
  <circle cx="9" cy="8" r="3.2" /><path d="M3 20c0-3.3 2.7-6 6-6" />
  <circle cx="17" cy="9" r="2.6" /><path d="M14 20c0-2.6 1.8-4.6 4-5.2" />
</>} />;
const Droplets = (p) => <Icon {...p} path={<>
  <path d="M12 3c2.5 3.5 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3.5-7.5 6-11Z" />
</>} />;

/* ---------------------------------------------------------------------------
   DATA — RUNUT WAKTU PENYALURAN DANA KARBON FCPF-CF KALIMANTAN TIMUR
--------------------------------------------------------------------------- */
const PHASES = [
  { id:1, fase:"Inisiasi & Komitmen", rentang:"2015 – 2019", judul:"Kaltim Ditetapkan Provinsi Percontohan REDD+", kategori:"Sistem/Skema", usd:0, idr:0, emisi:0,
    narasi:"Kementerian LHK dan Bank Dunia menunjuk Kaltim sebagai satu-satunya provinsi percontohan skema FCPF Carbon Fund di Indonesia. Disusun garis batas emisi (FREL), instrumen perlindungan sosial/lingkungan (safeguards), serta dokumen Benefit Sharing Plan (BSP).",
    penerima:"Pemerintah Provinsi Kaltim, Kementerian LHK", icon:Sprout },
  { id:2, fase:"Perjanjian Kontrak", rentang:"27 Nov 2020", judul:"Penandatanganan ERPA senilai USD 110 Juta", kategori:"Kontrak", usd:110, idr:1600, emisi:22,
    narasi:"Pemerintah Indonesia dan Bank Dunia resmi menandatangani Emission Reductions Payment Agreement (ERPA) senilai USD 110 Juta (±Rp 1,6 Triliun) atas target penurunan emisi 22 juta ton CO2e.",
    penerima:"Pemerintah Indonesia, Bank Dunia", icon:FileSignature },
  { id:3, fase:"Pemantauan & Audit", rentang:"2021 – 2022", judul:"Verifikasi Capaian Penurunan Emisi", kategori:"Audit", usd:0, idr:0, emisi:30,
    narasi:"Laporan Pemantauan (MRV) diserahkan. Auditor independen internasional mengonfirmasi Kaltim memangkas emisi melampaui target awal — mencapai lebih dari 30 juta ton CO2e.",
    penerima:"Auditor independen internasional, Bank Dunia", icon:ShieldCheck },
  { id:4, fase:"Advance Payment", rentang:"Des 2022 – Awal 2023", judul:"Pencairan Uang Muka: USD 20,9 Juta", kategori:"Transfer Dana", usd:20.9, idr:300, emisi:0,
    narasi:"Bank Dunia mentransfer uang muka (advance payment) sebesar USD 20,9 Juta (±Rp 300+ Miliar) ke Kas Negara via BPDLH, disalurkan bertahap ke Pemprov Kaltim, 8 Kabupaten/Kota, dan kelompok masyarakat.",
    penerima:"BPDLH, Pemprov Kaltim, 8 Kabupaten/Kota, kelompok masyarakat", icon:Banknote },
  { id:5, fase:"Aplikasi Dana di Tapak", rentang:"2023 – 2024", judul:"Penyaluran Berbasis Benefit Sharing Plan", kategori:"Implementasi", usd:0, idr:0, emisi:0,
    narasi:"Dana uang muka diaplikasikan di lapangan secara proporsional — insentif ekonomi ramah lingkungan & patroli hutan adat untuk Masyarakat Adat/Desa (ProKlim), operasional cegah karhutla & penegakan hukum untuk Pemda/KPH, serta pendampingan teknis dan verifikasi data untuk lembaga pendukung.",
    penerima:"Masyarakat Adat & Desa (ProKlim), Pemda & KPH, Lembaga Pendukung", icon:Trees },
  { id:6, fase:"Full Payment", rentang:"2025 – 2026", judul:"Pencairan Lanjutan: USD 89,1 Juta", kategori:"Transfer Dana", usd:89.1, idr:1300, emisi:0,
    narasi:"Finalisasi laporan MRV tahap dua dan kelengkapan dokumen safeguards. Bank Dunia bersiap mencairkan sisa pembayaran kinerja penuh USD 89,1 Juta (±Rp 1,3 Triliun), melengkapi total kesepakatan ERPA senilai USD 110 Juta.",
    penerima:"Pemprov Kaltim, Kabupaten/Kota, kelompok masyarakat", icon:Wallet },
];

const KATEGORI_STYLE = {
  "Sistem/Skema": { ring:"#6B8F71", chip:"#E7EEE3", text:"#3C5A44" },
  "Kontrak": { ring:"#C8792A", chip:"#FBEBDA", text:"#8A4E17" },
  "Audit": { ring:"#C8792A", chip:"#FBEBDA", text:"#8A4E17" },
  "Transfer Dana": { ring:"#3A6EA5", chip:"#E4ECF5", text:"#274A70" },
  "Implementasi": { ring:"#2F855A", chip:"#DFEEE3", text:"#1E5B3B" },
};

const CHART_DATA = [
  { name:"Total Kontrak ERPA", usd:110, fill:"#8A5A2E" },
  { name:"Advance Payment", usd:20.9, fill:"#3A6EA5" },
  { name:"Full Payment", usd:89.1, fill:"#2F855A" },
];

function fmtUsd(n){ return n ? `USD ${n.toLocaleString("id-ID",{maximumFractionDigits:1})} Jt` : "—"; }
function fmtIdr(n){ return n ? `≈Rp ${n.toLocaleString("id-ID")} M` : "—"; }

function SummaryCard({ icon:IconC, eyebrow, value, sub, accent }) {
  return (
    <div className="relative overflow-hidden rounded-2xl border p-5 flex flex-col justify-between min-h-[128px]"
         style={{ borderColor:"#DED6C3", background:"#FFFEFA" }}>
      <div className="absolute -right-4 -top-4 w-20 h-20 rounded-full opacity-[0.10]" style={{ background:accent }} />
      <div className="flex items-center gap-2 relative">
        <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style={{ background:accent+"1A" }}>
          <IconC size={16} color={accent} strokeWidth={2.2} />
        </div>
        <span className="text-[11px] tracking-[0.08em] uppercase font-semibold"
              style={{ color:"#6B7568", fontFamily:"'IBM Plex Mono', monospace" }}>{eyebrow}</span>
      </div>
      <div className="relative mt-3">
        <div className="text-2xl leading-tight font-semibold" style={{ color:"#22301F", fontFamily:"'Fraunces', serif" }}>{value}</div>
        <div className="text-[13px] mt-0.5" style={{ color:"#5F6B5B" }}>{sub}</div>
      </div>
    </div>
  );
}

function FCPFKaltimDashboard() {
  const [selected, setSelected] = useState(PHASES[1]);
  const totalUsd = 110, cairUsd = 20.9;
  const pct = Math.round((cairUsd / totalUsd) * 100);
  const activeStyle = KATEGORI_STYLE[selected.kategori];
  const maxUsd = 120;

  return (
    <div className="w-full min-h-full" style={{
      background:"radial-gradient(1200px 500px at 10% -10%, #EFEADA 0%, #F6F3EA 45%, #F6F3EA 100%)"
    }}>
      <div className="max-w-6xl mx-auto px-4 sm:px-8 py-10">

        {/* HEADER */}
        <div className="flex items-start gap-3 mb-2">
          <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 mt-1" style={{ background:"#1B4332" }}>
            <Leaf size={20} color="#DDEBD8" strokeWidth={2} />
          </div>
          <div>
            <div className="text-[11px] tracking-[0.16em] uppercase font-semibold"
                 style={{ color:"#6B7568", fontFamily:"'IBM Plex Mono', monospace" }}>
              FCPF Carbon Fund · Kalimantan Timur
            </div>
            <h1 className="text-[28px] sm:text-[34px] leading-[1.1] font-semibold mt-1"
                style={{ color:"#1B4332", fontFamily:"'Fraunces', serif" }}>
              Runut Waktu Program FCPF-CF di Kaltim
            </h1>
            <p className="text-[14px] mt-1.5 max-w-xl" style={{ color:"#5F6B5B" }}>
              Dari penandatanganan ERPA hingga pelunasan kinerja penuh — enam fase perjalanan dana
              hasil pengurangan emisi Kaltim, 2015–2026.
            </p>
          </div>
        </div>

        {/* SUMMARY CARDS */}
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-8">
          <SummaryCard icon={Landmark} eyebrow="Total Kontrak ERPA" value="USD 110 Jt" sub="≈ Rp 1,6 Triliun" accent="#8A5A2E" />
          <SummaryCard icon={Banknote} eyebrow="Advance Payment" value="USD 20,9 Jt" sub="≈ Rp 300 Miliar" accent="#3A6EA5" />
          <SummaryCard icon={Wallet} eyebrow="Full Payment" value="USD 89,1 Jt" sub="≈ Rp 1,3 Triliun" accent="#2F855A" />
        </div>

        {/* TIMELINE */}
        <div className="mt-12">
          <div className="flex items-center justify-between mb-5">
            <h2 className="text-[13px] tracking-[0.1em] uppercase font-semibold"
                style={{ color:"#3C5A44", fontFamily:"'IBM Plex Mono', monospace" }}>
              Enam Fase Perjalanan Dana
            </h2>
            <div className="hidden sm:flex items-center gap-4 text-[11px]" style={{ color:"#6B7568" }}>
              <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style={{ background:"#2F855A" }} /> Implementasi</span>
              <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style={{ background:"#3A6EA5" }} /> Transfer Dana</span>
              <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style={{ background:"#C8792A" }} /> Kontrak/Audit</span>
            </div>
          </div>

          <p className="italic font-bold text-[13px] mb-5" style={{ color:"#3C5A44" }}>
            Silakan klik pada setiap fase untuk informasi lebih lanjut.
          </p>

          <div className="relative">
            <svg className="absolute left-0 right-0 top-[26px] hidden sm:block" width="100%" height="6" preserveAspectRatio="none">
              <line x1="8%" y1="3" x2="92%" y2="3" stroke="#C9C0A6" strokeWidth="2" strokeDasharray="1 7" strokeLinecap="round" />
            </svg>
            <div className="grid grid-cols-2 sm:grid-cols-6 gap-3 sm:gap-2 relative">
              {PHASES.map((p) => {
                const s = KATEGORI_STYLE[p.kategori];
                const isActive = selected.id === p.id;
                const IconC = p.icon;
                return (
                  <button key={p.id} onClick={() => setSelected(p)} className="flex flex-col items-center text-center group focus:outline-none">
                    <div className="w-[52px] h-[52px] rounded-full flex items-center justify-center border-2 transition-all duration-200"
                         style={{ background:isActive ? s.ring : "#FFFEFA", borderColor:s.ring,
                                  boxShadow:isActive ? `0 0 0 5px ${s.ring}22` : "0 1px 2px rgba(0,0,0,0.04)" }}>
                      <IconC size={20} strokeWidth={2} color={isActive ? "#FFFEFA" : s.ring} />
                    </div>
                    <span className="text-[10px] font-semibold mt-2"
                          style={{ color:isActive ? "#22301F" : "#8A937F", fontFamily:"'IBM Plex Mono', monospace" }}>
                      {String(p.id).padStart(2,"0")} · {p.rentang.split(" ")[0]}
                    </span>
                    <span className="text-[12px] leading-tight mt-1 max-w-[110px]"
                          style={{ color:isActive ? "#22301F" : "#6B7568", fontWeight:isActive ? 600 : 500 }}>
                      {p.fase}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* DETAIL PANEL */}
          <div className="mt-8 rounded-2xl border p-6 sm:p-7 transition-colors duration-200" style={{ borderColor:"#DED6C3", background:"#FFFEFA" }}>
            <div className="flex flex-wrap items-center gap-3 mb-3">
              <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full" style={{ background:activeStyle.chip, color:activeStyle.text }}>
                {selected.kategori}
              </span>
              <span className="text-[12px]" style={{ color:"#8A937F", fontFamily:"'IBM Plex Mono', monospace" }}>
                Fase {String(selected.id).padStart(2,"0")} · {selected.rentang}
              </span>
            </div>
            <h3 className="text-[20px] sm:text-[23px] font-semibold leading-snug mb-3" style={{ color:"#1B4332", fontFamily:"'Fraunces', serif" }}>
              {selected.judul}
            </h3>
            <p className="text-[14px] leading-relaxed mb-5" style={{ color:"#485245" }}>{selected.narasi}</p>

            <div className="grid sm:grid-cols-3 gap-3">
              <div className="rounded-xl p-3.5" style={{ background:"#F6F3EA" }}>
                <div className="text-[10px] uppercase tracking-wide font-semibold" style={{ color:"#8A937F" }}>Nilai USD</div>
                <div className="text-[16px] font-semibold mt-1" style={{ color:"#22301F", fontFamily:"'IBM Plex Mono', monospace" }}>{fmtUsd(selected.usd)}</div>
              </div>
              <div className="rounded-xl p-3.5" style={{ background:"#F6F3EA" }}>
                <div className="text-[10px] uppercase tracking-wide font-semibold" style={{ color:"#8A937F" }}>Est. Nilai IDR</div>
                <div className="text-[16px] font-semibold mt-1" style={{ color:"#22301F", fontFamily:"'IBM Plex Mono', monospace" }}>{fmtIdr(selected.idr)}</div>
              </div>
              <div className="rounded-xl p-3.5" style={{ background:"#F6F3EA" }}>
                <div className="text-[10px] uppercase tracking-wide font-semibold" style={{ color:"#8A937F" }}>Target/Capaian Emisi</div>
                <div className="text-[16px] font-semibold mt-1" style={{ color:"#22301F", fontFamily:"'IBM Plex Mono', monospace" }}>
                  {selected.emisi ? `${selected.emisi} Jt Ton CO2e` : "—"}
                </div>
              </div>
            </div>

            <div className="flex items-start gap-2 mt-5 pt-5 border-t" style={{ borderColor:"#E5E0D0" }}>
              <Users size={16} color="#6B8F71" strokeWidth={2} />
              <div>
                <div className="text-[11px] uppercase tracking-wide font-semibold" style={{ color:"#8A937F" }}>Penerima Manfaat / Fokus</div>
                <div className="text-[13.5px] mt-0.5" style={{ color:"#3C5A44" }}>{selected.penerima}</div>
              </div>
            </div>
          </div>
        </div>

        {/* FINANCIAL PROGRESS */}
        <div className="mt-12">
          <div className="flex items-center justify-between mb-1">
            <h2 className="text-[13px] tracking-[0.1em] uppercase font-semibold" style={{ color:"#3C5A44", fontFamily:"'IBM Plex Mono', monospace" }}>
              Progres Finansial ERPA
            </h2>
            <span className="text-[12px]" style={{ color:"#6B7568" }}>{pct}% dari total kontrak telah cair</span>
          </div>
          <p className="text-[13px] mb-5" style={{ color:"#6B7568" }}>
            Perbandingan total kontrak, Advance Payment yang telah cair, dan Full Payment yang menanti pelunasan.
          </p>

          <div className="rounded-2xl border p-4 sm:p-6" style={{ borderColor:"#DED6C3", background:"#FFFEFA" }}>
            <div className="flex flex-col gap-4">
              {CHART_DATA.map((d) => (
                <div key={d.name} className="flex items-center gap-3">
                  <span className="text-[12.5px] w-[150px] shrink-0" style={{ color:"#3C5A44" }}>{d.name}</span>
                  <div className="flex-1 h-[26px] rounded-full overflow-hidden" style={{ background:"#F0EDE0" }}>
                    <div className="h-full rounded-full transition-all duration-700"
                         style={{ width: `${(d.usd / maxUsd) * 100}%`, background:d.fill }} />
                  </div>
                  <span className="text-[12.5px] font-semibold w-[90px] text-right shrink-0"
                        style={{ color:"#22301F", fontFamily:"'IBM Plex Mono', monospace" }}>
                    USD {d.usd} Jt
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* FOOTER */}
        <div className="mt-10 flex items-start gap-2 text-[12px]" style={{ color:"#8A937F" }}>
          <Droplets size={14} strokeWidth={2} />
          <p>
            Disusun berdasarkan runut waktu penyaluran Dana Karbon FCPF-Carbon Fund Kalimantan Timur.
            Nilai IDR merupakan estimasi konversi pada saat masing-masing peristiwa.
          </p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FCPFKaltimDashboard />);
</script>
</body>
</html>
